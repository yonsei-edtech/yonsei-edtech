name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Vercel 런타임(24.x)과 일치 — firebase-admin 14 는 Node>=22 필요
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        run: npx tsc --noEmit

      # ESLint error는 차단, warning은 prebuild의 warning ratchet(증가 금지)이 관리
      - name: Lint (errors block)
        run: npx eslint src --quiet

      - name: Unit tests
        run: npm test

      # prebuild: raw color ratchet + ESLint warning ratchet 포함
      - name: Build
        run: npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: "e30=" # empty json base64 for build
